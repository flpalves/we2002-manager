<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Escudo — preview</title></head>
<body>
<div class="we-row" style="gap:28px;align-items:flex-end">
  <span class="we-escudo">PNG</span>
  <span class="we-escudo we-escudo--g we-escudo--provisorio" style="--escudo-cor:#C8102E;--escudo-texto:#ffffff" aria-hidden="true">FLA</span>
  <span class="we-escudo we-escudo--g we-escudo--provisorio" style="--escudo-cor:#006437;--escudo-texto:#ffffff" aria-hidden="true">PAL</span>

  <span class="we-time"><span class="we-escudo we-escudo--p we-escudo--provisorio" style="--escudo-cor:#F5C400;--escudo-texto:#111111" aria-hidden="true">MIR</span>Mirassol</span>

<div style="padding:0 16px 16px;max-width:420px">

    <tbody>
      <tr>
        <td style="text-align:right"><span class="we-time">Flamengo<span class="we-escudo we-escudo--p we-escudo--provisorio" style="--escudo-cor:#C8102E" aria-hidden="true">FLA</span></span></td>
        <td style="text-align:center;color:var(--texto-suave)">x</td>
        <td><span class="we-time"><span class="we-escudo we-escudo--p we-escudo--provisorio" style="--escudo-cor:#006437" aria-hidden="true">PAL</span>Palmeiras</span></td>
      </tr>
      <tr>
        <td style="text-align:right"><span class="we-time">Botafogo<span class="we-escudo we-escudo--p we-escudo--provisorio" style="--escudo-cor:#111111" aria-hidden="true">BOT</span></span></td>
        <td style="text-align:center;color:var(--texto-suave)">x</td>
        <td><span class="we-time"><span class="we-escudo we-escudo--p we-escudo--provisorio" style="--escudo-cor:#0D80BF" aria-hidden="true">GRE</span>Grêmio</span></td>
      </tr>
    </tbody>
  </table>
</div>

</html>
