<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>WE2002 Manager · Campeonato</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <div class="marca"><span class="bola"></span>WE2002 <b>Manager</b></div>
    <nav class="nav">
      <button class="nav-btn" data-tela="campeonato">Campeonato</button>
      <button class="nav-btn" id="btn-amistoso" data-tela="amistoso" title="Partida avulsa, fora do campeonato">Amistoso</button>
      <button class="nav-btn" data-tela="times" title="Criar times e editar jogadores">Times</button>
    </nav>
    <div id="titulo-camp" class="titulo-camp"></div>
    <div class="topo-acoes">
      <button class="btn fantasma" id="btn-pasta" title="Abrir a pasta do projeto">Pasta do projeto</button>
      <button class="btn fantasma" id="btn-novo" hidden>Novo campeonato</button>
    </div>
  </header>

  <main id="app"></main>

  <div id="aviso" class="aviso" hidden></div>
  <script src="app.js"></script>
</body>
</html>
